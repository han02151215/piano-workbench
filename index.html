<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-title" content="钢琴练习">
  <link rel="manifest" href="manifest.json">
  <title>🎹 钢琴工作台</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #e94560;
      --accent2: #533483;
      --text: #eaeaea;
      --text-dim: #8888aa;
      --success: #00d9a3;
      --warning: #ffc107;
      --border: #2a2a4a;
      --piano-white: #f0f0f0;
      --piano-black: #1a1a1a;
      --nav-h: 56px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif; font-size: 14px; line-height: 1.5; overflow-x: hidden; }
    body { padding: calc(var(--safe-top) + 60px) 14px calc(var(--safe-bottom) + 70px); min-height: 100vh; }

    /* 灵动岛占位 */
    .notch-spacer { height: 60px; background: var(--bg); margin: 0 -14px; }

    /* 顶部标题 */
    .header { text-align: center; margin-bottom: 16px; padding: 8px 0; }
    .header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .header .date { font-size: 0.78rem; color: var(--text-dim); }

    /* 卡片 */
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .card-title .title-icon { font-size: 1.1rem; }
    .card-title .title-left { flex: 1; }
    .card-title .title-extra { font-size: 0.72rem; color: var(--text-dim); }

    /* 输入控件 */
    .time-input-row { display: flex; align-items: center; gap: 8px; }
    .time-input-row input { flex: 1; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; text-align: center; }
    .time-input-row .unit { font-size: 0.9rem; color: var(--text-dim); }
    .btn { padding: 9px 14px; border-radius: 10px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--accent2); color: white; }
    .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    /* 文本域 */
    textarea { width: 100%; min-height: 100px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.88rem; font-family: inherit; resize: vertical; }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); }

    /* 列表项 */
    .list-item { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 0.85rem; display: flex; align-items: flex-start; gap: 8px; }
    .list-item .idx { color: var(--text-dim); font-weight: 600; min-width: 22px; }
    .list-item .content { flex: 1; word-break: break-all; }
    .list-item .del { color: var(--text-dim); font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }

    /* 周目标列表 */
    .goal-item { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .goal-check { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .goal-check.done { background: var(--success); border-color: var(--success); }
    .goal-check.done::after { content: '✓'; color: white; font-size: 0.8rem; font-weight: bold; }
    .goal-text { flex: 1; font-size: 0.88rem; }
    .goal-text.done { text-decoration: line-through; color: var(--text-dim); }
    .goal-del { color: var(--text-dim); font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; }

    /* 周目标输入行 */
    .goal-input-row { display: flex; gap: 6px; margin-top: 8px; }
    .goal-input-row input { flex: 1; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.88rem; }

    /* 统计数字 */
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-box { background: var(--bg); border-radius: 10px; padding: 12px 10px; text-align: center; }
    .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
    .stat-val .stat-unit { font-size: 0.75rem; font-weight: 500; color: var(--text-dim); margin-left: 2px; }
    .stat-lbl { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }

    /* 热力图 */
    .heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
    .heatmap .day-cell { aspect-ratio: 1; border-radius: 3px; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.5rem; color: var(--text-dim); position: relative; }
    .heatmap .day-cell.l1 { background: rgba(0, 217, 163, 0.25); }
    .heatmap .day-cell.l2 { background: rgba(0, 217, 163, 0.55); }
    .heatmap .day-cell.l3 { background: rgba(0, 217, 163, 0.85); }
    .heatmap .day-cell.l4 { background: var(--success); }
    .heatmap .day-cell.today { outline: 2px solid var(--accent); outline-offset: -1px; }
    .heatmap-legend { display: flex; align-items: center; gap: 4px; font-size: 0.65rem; color: var(--text-dim); margin-top: 8px; justify-content: flex-end; }
    .heatmap-legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
    .heatmap-month-label { text-align: center; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
    .heatmap-weekday { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 0.6rem; color: var(--text-dim); text-align: center; margin-bottom: 4px; }

    /* 月度导航 */
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .month-nav .month-btn { background: transparent; border: none; color: var(--text); font-size: 1rem; padding: 4px 12px; cursor: pointer; }

    /* 钢琴键盘 */
    .piano-wrap { background: var(--card); padding: 14px 8px; border-radius: 14px; margin-bottom: 12px; }
    .piano { display: flex; position: relative; height: 140px; user-select: none; }
    .piano-key { flex: 1; background: var(--piano-white); border-radius: 0 0 6px 6px; margin-right: 1px; position: relative; cursor: pointer; transition: background 0.1s; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 0.6rem; color: #555; }
    .piano-key:active { background: #e0e0e0; }
    .piano-key.black { position: absolute; width: 8%; background: var(--piano-black); height: 60%; top: 0; border-radius: 0 0 4px 4px; z-index: 2; color: #aaa; }

    /* 通用 */
    .empty-tip { color: var(--text-dim); text-align: center; padding: 14px 0; font-size: 0.78rem; }
    .toast { position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px); left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; max-width: 80%; text-align: center; }
    .toast.show { opacity: 1; }

    /* 底部导航 */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 100; }
    .nav-item { flex: 1; background: transparent; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; font-size: 0.68rem; cursor: pointer; }
    .nav-item .nav-icon { font-size: 1.3rem; margin-bottom: 1px; }
    .nav-item.active { color: var(--accent); }

    /* 页面切换 */
    .page { display: none; }
    .page.active { display: block; }

    /* 月份选择器 */
    .month-picker { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 600; }
    .month-picker button { background: transparent; border: none; color: var(--text); font-size: 1.1rem; padding: 0 8px; cursor: pointer; }

    /* 月度总结文本 */
    .month-summary-text { font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; padding: 10px; background: var(--bg); border-radius: 10px; min-height: 60px; }
    .month-summary-text.empty { color: var(--text-dim); font-style: italic; }

    /* 列表meta */
    .item-meta { font-size: 0.65rem; color: var(--text-dim); margin-top: 4px; }

    /* 标签 */
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.65rem; background: var(--accent2); color: white; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="notch-spacer"></div>

  <div class="header">
    <h1 id="pageTitle">📅 今日</h1>
    <div class="date" id="currentDate"></div>
  </div>

  <!-- 📅 今日记录 -->
  <div class="page active" id="page-today">
    <!-- 时长输入（分支） -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">⏱️</span>
        <span class="title-left">练习时长</span>
        <span class="title-extra" id="todayTotalTime">总计 0 分钟</span>
      </div>
      <div style="display:grid;gap:8px;">
        <div class="time-input-row">
          <span style="font-size:0.85rem;width:70px;">🔄 复习</span>
          <input type="number" id="timeReview" inputmode="numeric" placeholder="0" min="0" oninput="updateTodayTotal()">
          <span class="unit">分钟</span>
        </div>
        <div class="time-input-row">
          <span style="font-size:0.85rem;width:70px;">💪 基本功</span>
          <input type="number" id="timeBasic" inputmode="numeric" placeholder="0" min="0" oninput="updateTodayTotal()">
          <span class="unit">分钟</span>
        </div>
        <div class="time-input-row">
          <span style="font-size:0.85rem;width:70px;">🎵 乐曲</span>
          <input type="number" id="timePiece" inputmode="numeric" placeholder="0" min="0" oninput="updateTodayTotal()">
          <span class="unit">分钟</span>
        </div>
      </div>
    </div>

    <!-- 技巧难点 -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">🎯</span>
        <span class="title-left">今日内容</span>
        <span class="title-extra">练了什么 + 难点</span>
      </div>
      <textarea id="todayContent" placeholder="今天练了什么？&#10;遇到了什么难点？&#10;比如：哈农1-10 / 车尔尼Op.599 No.20 / 指法换指、节奏不均匀"></textarea>
      <button class="btn btn-primary" style="margin-top:8px;width:100%;" onclick="saveToday()">💾 保存今日记录</button>
    </div>

    <!-- 今日快速统计 -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">📊</span>
        <span class="title-left">本周进度</span>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="weekTotalTime">0<span class="stat-unit">分</span></div>
          <div class="stat-lbl">本周总时长</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="weekDays">0<span class="stat-unit">天</span></div>
          <div class="stat-lbl">本周练习天数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="weekGoalsDone">0<span class="stat-unit">/0</span></div>
          <div class="stat-lbl">周目标完成</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="weekAvgTime">0<span class="stat-unit">分</span></div>
          <div class="stat-lbl">日均时长</div>
        </div>
      </div>
      <div style="margin-top:10px;display:flex;gap:6px;">
        <button class="btn btn-ghost" style="flex:1;font-size:0.7rem;padding:6px;" onclick="importOldData(true)">🔄 导入旧数据</button>
        <button class="btn btn-ghost" style="flex:1;font-size:0.7rem;padding:6px;" onclick="diagnoseData()">🔍 诊断</button>
      </div>
    </div>
  </div>

  <!-- 📋 本周计划 -->
  <div class="page" id="page-week">
    <div class="card">
      <div class="card-title">
        <span class="title-icon">🎯</span>
        <span class="title-left">本周目标</span>
        <span class="title-extra" id="weekDateRange"></span>
      </div>
      <div id="goalsList"></div>
      <div class="goal-input-row">
        <input type="text" id="goalInput" placeholder="这周要完成什么？比如：把巴赫小步舞曲弹熟" onkeydown="if(event.key==='Enter')addGoal()">
        <button class="btn btn-primary" onclick="addGoal()">+</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="title-icon">📈</span>
        <span class="title-left">本周数据</span>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="wStat1">0<span class="stat-unit">分</span></div>
          <div class="stat-lbl">总时长</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="wStat2">0<span class="stat-unit">天</span></div>
          <div class="stat-lbl">练习天数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="wStat3">0<span class="stat-unit">分</span></div>
          <div class="stat-lbl">日均</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="wStat4">0<span class="stat-unit">次</span></div>
          <div class="stat-lbl">日最多</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="title-icon">📝</span>
        <span class="title-left">本周内容回顾</span>
      </div>
      <div id="weekReview"></div>
    </div>
  </div>

  <!-- 📆 本月总结 -->
  <div class="page" id="page-month">
    <div class="card">
      <div class="card-title">
        <span class="title-icon">📆</span>
        <span class="title-left">月度数据</span>
      </div>
      <div class="month-nav">
        <div class="month-picker">
          <button onclick="changeMonth(-1)">‹</button>
          <span id="monthLabel"></span>
          <button onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="mStat1">0<span class="stat-unit">小时</span></div>
          <div class="stat-lbl">本月总时长</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="mStat2">0<span class="stat-unit">天</span></div>
          <div class="stat-lbl">练习天数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="mStat3">0<span class="stat-unit">天</span></div>
          <div class="stat-lbl">本月最长连续</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="mStat4">0<span class="stat-unit">%</span></div>
          <div class="stat-lbl">练习率</div>
        </div>
      </div>
      <div id="monthBranchStats"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="title-icon">🔥</span>
        <span class="title-left">练习热力图</span>
      </div>
      <div class="heatmap-month-label" id="heatMonthLabel"></div>
      <div class="heatmap-weekday">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heatmap-legend">
        <span>少</span>
        <div class="swatch" style="background:var(--border);"></div>
        <div class="swatch" style="background:rgba(0,217,163,0.25);"></div>
        <div class="swatch" style="background:rgba(0,217,163,0.55);"></div>
        <div class="swatch" style="background:rgba(0,217,163,0.85);"></div>
        <div class="swatch" style="background:var(--success);"></div>
        <span>多</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="title-icon">💭</span>
        <span class="title-left">本月总结</span>
      </div>
      <textarea id="monthSummaryText" placeholder="本月最大的收获是什么？&#10;进步在哪里？&#10;下个月的目标？"></textarea>
      <button class="btn btn-primary" style="margin-top:8px;width:100%;" onclick="saveMonthSummary()">💾 保存本月总结</button>
    </div>
  </div>

  <!-- 🎹 钢琴 -->
  <div class="page" id="page-piano">
    <div class="piano-wrap">
      <div class="card-title"><span class="title-icon">🎹</span><span class="title-left">虚拟钢琴</span></div>
      <div class="piano" id="piano"></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="title-icon">🎮</span><span class="title-left">小游戏</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
        <button class="btn btn-secondary" onclick="startGame('ear')">🎧 听音辨音</button>
        <button class="btn btn-secondary" onclick="startGame('note')">🎵 认谱</button>
        <button class="btn btn-secondary" onclick="startGame('rhythm')">🥁 节奏</button>
        <button class="btn btn-secondary" onclick="startGame('pitch')">🔊 高低音</button>
      </div>
      <div id="gameArea" style="margin-top:14px;"></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="title-icon">📚</span><span class="title-left">乐理知识</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
        <button class="btn btn-ghost" onclick="showTheory('note')">音符节拍</button>
        <button class="btn btn-ghost" onclick="showTheory('scale')">音阶调式</button>
        <button class="btn btn-ghost" onclick="showTheory('chord')">和弦基础</button>
        <button class="btn btn-ghost" onclick="showTheory('sign')">常用记号</button>
      </div>
      <div id="theoryArea" style="margin-top:14px;"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 底部导航 -->
  <div class="nav">
    <button class="nav-item active" data-page="today" onclick="switchPage('today')">
      <span class="nav-icon">📅</span><span>今日</span>
    </button>
    <button class="nav-item" data-page="week" onclick="switchPage('week')">
      <span class="nav-icon">📋</span><span>本周</span>
    </button>
    <button class="nav-item" data-page="month" onclick="switchPage('month')">
      <span class="nav-icon">📆</span><span>本月</span>
    </button>
    <button class="nav-item" data-page="piano" onclick="switchPage('piano')">
      <span class="nav-icon">🎹</span><span>钢琴</span>
    </button>
  </div>

  <script>
    // ===== 数据模型 =====
    // daily[dateKey] = { time: number, content: string }
    // weeklyGoals = { "2026-W31": [{text, done}] }  // ISO week
    // monthlySummary = { "2026-07": "text" }
    
    let daily = JSON.parse(localStorage.getItem('pp_daily') || '{}');
    let weeklyGoals = JSON.parse(localStorage.getItem('pp_goals') || '{}');
    let monthlySummary = JSON.parse(localStorage.getItem('pp_summary') || '{}');
    
    function save(){ 
      localStorage.setItem('pp_daily', JSON.stringify(daily));
      localStorage.setItem('pp_goals', JSON.stringify(weeklyGoals));
      localStorage.setItem('pp_summary', JSON.stringify(monthlySummary));
    }
    
    function todayKey(){ return new Date().toDateString(); }
    function dateKey(d){ return d.toDateString(); }
    function weekKey(d){
      // ISO week
      const date = new Date(d);
      date.setHours(0,0,0,0);
      date.setDate(date.getDate() + 4 - (date.getDay()||7));
      const yearStart = new Date(date.getFullYear(),0,1);
      const weekNo = Math.ceil((((date - yearStart)/86400000)+1)/7);
      return date.getFullYear() + '-W' + String(weekNo).padStart(2,'0');
    }
    function monthKey(d){
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }
    
    function ensureToday(){
      const k = todayKey();
      if(!daily[k]) daily[k] = { time:0, timeReview:0, timeBasic:0, timePiece:0, content:'' };
      // 兼容旧数据
      if(daily[k].timeReview===undefined) daily[k].timeReview = 0;
      if(daily[k].timeBasic===undefined) daily[k].timeBasic = 0;
      if(daily[k].timePiece===undefined) daily[k].timePiece = 0;
      return daily[k];
    }
    
    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;

    // ===== 本周 =====
    function getWeekData(refDate){
      const dates = [];
      const d = new Date(refDate);
      d.setHours(0,0,0,0);
      // 周一到周日
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      for(let i=0;i<7;i++){
        const nd = new Date(d);
        nd.setDate(nd.getDate() + i);
        dates.push(nd);
      }
      let totalTime = 0, totalReview = 0, totalBasic = 0, totalPiece = 0;
      let days = 0;
      let maxTime = 0;
      dates.forEach(dt=>{
        const k = dateKey(dt);
        if(daily[k]){
          const t = dayTotalTime(daily[k]);
          if(t > 0){
            totalTime += t;
            totalReview += daily[k].timeReview || 0;
            totalBasic += daily[k].timeBasic || 0;
            totalPiece += daily[k].timePiece || 0;
            days++;
            if(t > maxTime) maxTime = t;
          }
        }
      });
      return {dates, totalTime, totalReview, totalBasic, totalPiece, days, maxTime};
    }

    function getMonthData(date){
      const year = date.getFullYear();
      const month = date.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      let totalTime = 0, totalReview = 0, totalBasic = 0, totalPiece = 0;
      let days = 0;
      let maxStreak = 0;
      let curStreak = 0;
      const dayData = [];
      for(let d=1; d<=daysInMonth; d++){
        const dt = new Date(year, month, d);
        const k = dateKey(dt);
        const entry = daily[k];
        const t = entry ? dayTotalTime(entry) : 0;
        dayData.push({date:dt, time:t, review:entry?.timeReview||0, basic:entry?.timeBasic||0, piece:entry?.timePiece||0});
        if(t > 0){
          totalTime += t;
          totalReview += entry?.timeReview || 0;
          totalBasic += entry?.timeBasic || 0;
          totalPiece += entry?.timePiece || 0;
          days++;
          curStreak++;
          if(curStreak > maxStreak) maxStreak = curStreak;
        } else {
          curStreak = 0;
        }
      }
      return {totalTime, totalReview, totalBasic, totalPiece, days, maxStreak, dayData, daysInMonth};
    }

      // 热力图

      // 当月日期

        }

      NOTES.forEach((n, i)=>{
        if(BLACK_INDICES.includes(i)){
          // 找它前面最近的白键
          let whiteIdx = -1;
          for(let j=i-1; j>=0; j--){
            if(!BLACK_INDICES.includes(j)){whiteIdx = j; break;}
          }
          // 计算位置 (whiteIdx + 1 个白键)
          const left = ((blackIdx + 1) * 100 / 8) - 4; // 简化近似
          const el = document.createElement('div');
          el.className = 'piano-key black';
          el.style.left = (blackIdx * 12.5 + 8.5) + '%';
          el.style.width = '8%';
          el.textContent = n.name;

          piano.appendChild(el);
          blackIdx++;
        }
      });

    }
    
    function playNote(freq){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      }catch(e){}
    }

        <strong>转位</strong>：<br>
        第一转位：3音当低音<br>
        第二转位：5音当低音
      </div>`,
      sign: `<div style="line-height:1.7;"><strong>常用记号</strong><br><br>
        <strong>连线 ⌒</strong>：连音，弹成一个音<br>
        <strong>跳音 ·</strong>：短促、跳跃<br>
        <strong>延长 ⌐</strong>：自由延长<br>
        <strong>强弱 p/f</strong>：弱/强<br>
        <strong>踏板 Ped.</strong>：踩右踏板
      </div>`
    };
    
    function renderTheory(){ /* 占位 */ }
    
    function showTheory(key){
      document.getElementById('theoryArea').innerHTML = `<div class="card" style="background:var(--bg);font-size:0.85rem;">${THEORY[key]}</div>`;
    }
    
    // ===== 工具 =====
    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    
    // ===== 初始化 =====
    // ===== 旧数据导入 =====
    function importOldData(manual=false){
      // 尝试多个可能的旧 key
      const possibleKeys = ['pp_data', 'pianoPractice', 'piano_data'];
      let oldRaw = null;
      let foundKey = '';
      for(const key of possibleKeys){
        const raw = localStorage.getItem(key);
        if(raw && raw.length > 10){
          oldRaw = raw;
          foundKey = key;
          break;
        }
      }
      
      if(!oldRaw){
        if(manual) toast('❌ 没有找到旧数据。可能是：\n1)旧数据在另一个书签/PWA里\n2)localStorage已被清除');
        return 0;
      }
      
      let old;
      try { old = JSON.parse(oldRaw); } catch(e){ 
        if(manual) toast('❌ 数据格式无法解析');
        return 0; 
      }
      if(!old || typeof old !== 'object' || Object.keys(old).length === 0){
        if(manual) toast('❌ 旧数据为空');
        return 0;
      }
      
      // 判断数据格式：v3格式有 review/basic/pieces 字段，v4格式有 timeReview
      let imported = 0;
      let skipped = 0;
      const firstEntry = old[Object.keys(old)[0]];
      
      // 已经是新格式，直接合并
      if(firstEntry && (firstEntry.timeReview !== undefined || firstEntry.content !== undefined)){
        Object.keys(old).forEach(dateStr=>{
          const o = old[dateStr];
          if(!o) return;
          // 手动导入时强制覆盖，自动导入时跳过已有数据
          if(!manual && daily[dateStr] && dayTotalTime(daily[dateStr]) > 0){ skipped++; return; }
          daily[dateStr] = {
            time: (o.timeReview||0)+(o.timeBasic||0)+(o.timePiece||0),
            timeReview: o.timeReview||0,
            timeBasic: o.timeBasic||0,
            timePiece: o.timePiece||0,
            content: o.content||''
          };
          imported++;
        });
      } else {
        // v3 旧格式转换
        Object.keys(old).forEach(dateStr=>{
          const o = old[dateStr];
          if(!o) return;
          if(!manual && daily[dateStr] && dayTotalTime(daily[dateStr]) > 0){ skipped++; return; }
          
          const totalTime = o.time || 0;
          let contentParts = [];
          if(o.review && o.review.length > 0){
            contentParts.push('复习：'+o.review.map(r=>r.name+(r.count>0?' ×'+r.count:'')).join('、'));
          }
          if(o.basic && o.basic.length > 0){
            contentParts.push('基本功：'+o.basic.map(b=>b.name+(b.count>0?' ×'+b.count:'')).join('、'));
          }
          if(o.pieces && o.pieces.length > 0){
            contentParts.push('乐曲：'+o.pieces.map(p=>p.name+(p.done?' ✓':'')).join('、'));
          }
          if(o.notes) contentParts.push('笔记：'+o.notes);
          
          const revCount=(o.review||[]).length, basicCount=(o.basic||[]).length, pieceCount=(o.pieces||[]).length;
          const totalItems=revCount+basicCount+pieceCount;
          let tr=0,tb=0,tp=0;
          if(totalItems>0){tr=Math.round(totalTime*revCount/totalItems);tb=Math.round(totalTime*basicCount/totalItems);tp=totalTime-tr-tb;}
          else tr=totalTime;
          
          daily[dateStr]={time:totalTime,timeReview:tr,timeBasic:tb,timePiece:tp,content:contentParts.join('\n')};
          imported++;
        });
      }
      
      if(imported>0){
        save();
        const totalMinutes = Object.values(daily).reduce((s,d)=>s+(d.timeReview||0)+(d.timeBasic||0)+(d.timePiece||0), 0);
        const totalHours = (totalMinutes/60).toFixed(1);
        if(manual) toast('✅ 导入 '+imported+' 天，总计 '+totalHours+' 小时'+(skipped>0?' (跳过'+skipped+'天)':''));
      } else {
        if(manual) toast('已有 '+Object.keys(daily).length+' 天数据，未发现新的可导入记录');
      }
      renderToday();
      return imported;
    }
    
    function diagnoseData(){
      let info = [];
      // 检查所有可能的 localStorage key
      const keys = ['pp_daily','pp_data','pianoPractice','pp_goals','pp_summary'];
      keys.forEach(k=>{
        const v = localStorage.getItem(k);
        if(v){
          try{
            const parsed = JSON.parse(v);
            if(typeof parsed === 'object'){
              info.push(k + ': ' + Object.keys(parsed).length + ' 条记录');
            }
          }catch(e){
            info.push(k + ': 有数据但非JSON('+v.length+'字符)');
          }
        } else {
          info.push(k + ': 无');
        }
      });
      // 检查是否是 PWA standalone 模式
      info.push('模式: ' + (window.matchMedia('(display-mode: standalone)').matches ? 'PWA独立窗口' : 'Safari浏览器'));
      toast('📋 ' + info.join('\n'));
    }
    
    function init(){
      // 导入旧数据
      importOldData();
      
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
      ensureToday();
      renderToday();
    }
    
    init();
  </script>
</body>
</html>
